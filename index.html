<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felicidades, Isabella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Great+Vibes&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14264f;--gold:#c9962b;--red:#b3202f;--win:#7fb2dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.night{--win:#ffd873}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#6fb9ee;font-family:'Nunito',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.layer{position:absolute;inset:0;pointer-events:none}
#skyD{background:linear-gradient(#6fb9ee 0%,#bfe2f6 55%,#fde6b0 100%)}
#skyN{background:linear-gradient(#070b27 0%,#16225e 55%,#5a2d7a 100%);opacity:0;transition:opacity 2s}
body.night #skyN{opacity:1}
#stars{opacity:0;transition:opacity 2s}
body.night #stars{opacity:1}
#stars i{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.8);opacity:.8;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
#clouds{transition:opacity 2s}
body.night #clouds{opacity:0}
.cloud{position:absolute;left:-30%;width:var(--w);height:calc(var(--w)*.3);background:#fff;border-radius:999px;opacity:.92;animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:42%;height:140%;left:14%;top:-60%}
.cloud::after{width:34%;height:120%;right:16%;top:-45%}
@keyframes drift{to{transform:translateX(160vw)}}
.orb{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);width:64px;aspect-ratio:1;border-radius:50%;transition:transform 2s ease,opacity 1.6s}
@media (min-width:1100px){.orb{right:7%;top:9%;width:120px}}
#sun{background:radial-gradient(circle at 40% 35%,#fffef0 0,#ffe98a 50%,#ffb830 100%);box-shadow:0 0 30px 10px rgba(255,214,90,.8),0 0 90px 35px rgba(255,200,80,.45)}
#moon{background:radial-gradient(circle at 62% 38%,rgba(185,165,115,.5) 0 9%,transparent 10%),radial-gradient(circle at 34% 62%,rgba(185,165,115,.45) 0 12%,transparent 13%),radial-gradient(circle at 35% 30%,#fffdf2 0,#fff3c8 50%,#eadfb0 100%);box-shadow:0 0 28px 8px rgba(255,244,200,.7),0 0 100px 35px rgba(255,235,170,.35);opacity:0;transform:translateY(160px)}
body.night #sun{opacity:0;transform:translateY(160px)}
body.night #moon{opacity:1;transform:none}
#caps{z-index:1}
.fc{position:absolute;bottom:-60px;opacity:.55;animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rise{to{transform:translate(var(--x),-115vh) rotate(var(--r))}}
.cap{display:block;width:100%}
#scene{position:absolute;inset:0;pointer-events:none;transition:filter 2s}
body.night #scene{filter:brightness(.68) saturate(.95) hue-rotate(10deg)}
#lawn{position:absolute;left:0;right:0;bottom:0;height:15%;background:linear-gradient(#7ccb6c,#4e9f55)}
#walk{position:absolute;left:50%;bottom:0;width:30%;max-width:260px;height:15%;transform:translateX(-50%);background:#e9dfc6;clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}
#bld{position:absolute;left:50%;bottom:12.5%;transform:translateX(-50%);width:min(96vw,780px);height:auto;display:block}
#bld .w{fill:var(--win);transition:fill 1.8s}
.bl{position:absolute;bottom:var(--b);width:clamp(22px,4.6vw,38px);transform-origin:50% 100%;animation:bob 4s ease-in-out infinite alternate;animation-delay:var(--dl)}
.bl svg{display:block;width:100%;overflow:visible}
@keyframes bob{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-8px)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.tc{position:fixed;z-index:30;pointer-events:none}
#card{position:absolute;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);width:min(88vw,620px);padding:30px 28px 44px;text-align:center;color:#24305e;background:radial-gradient(#fffaf0,#f7ecd0);border-radius:6px;box-shadow:inset 0 0 0 6px #fbf3df,inset 0 0 0 8px var(--gold),0 14px 40px rgba(10,20,60,.35);transition:box-shadow 1.6s}
#card::before,#card::after{content:"";position:absolute;left:-14px;right:-14px;height:18px;border-radius:10px;background:linear-gradient(#d9c28a,#f7ecd0 45%,#d2b878);box-shadow:0 3px 8px rgba(0,0,0,.25)}
#card::before{top:-10px}
#card::after{bottom:-10px}
body.night #card{box-shadow:inset 0 0 0 6px #fbf3df,inset 0 0 0 8px var(--gold),0 0 50px rgba(255,214,120,.55),0 14px 40px rgba(0,0,0,.5)}
.kicker{font-family:'Great Vibes',cursive;font-size:clamp(2rem,8.5vw,3rem);color:var(--red);line-height:1.1}
.name{font-family:'Great Vibes',cursive;font-size:clamp(2.6rem,12vw,4.4rem);color:var(--navy);line-height:1.05}
.orn{height:14px;margin:6px auto 12px;width:60%;position:relative;background:linear-gradient(90deg,transparent,var(--gold),transparent) center/100% 2px no-repeat}
.orn::after{content:"\25C6";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--gold);font-size:12px;background:#fbf3df;padding:0 8px;line-height:1}
#msg{font-family:'Nunito',system-ui,sans-serif;font-weight:600;color:#1b2550;font-size:clamp(1.05rem,min(4.6vw,3.1vh),1.5rem);line-height:1.38}
#msg p{margin:0 0 .6em;text-wrap:pretty}
#msg p.f{color:var(--red);font-weight:700}
.rv{opacity:0;transform:translateY(8px);filter:blur(4px);transition:opacity 1.2s,transform 1.2s,filter 1.2s;transition-delay:calc(var(--i)*.6s)}
#card.show .rv{opacity:1;transform:none;filter:none}
#card.reset .rv{transition:none}
.seal{position:absolute;left:50%;bottom:-32px;width:56px;transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#girl{position:absolute;left:50%;bottom:1.2%;transform:translateX(-50%);height:min(30vh,270px);aspect-ratio:200/420;pointer-events:none}
#girl .fig{height:100%;transform-origin:50% 100%;animation:br 4s ease-in-out infinite alternate}
#girl svg{height:100%;width:auto;display:block;overflow:visible}
@keyframes br{to{transform:scaleY(1.008)}}
#girl.ch .fig{animation:cheer .7s ease-out}
@keyframes cheer{30%{transform:translateY(-14px)}60%{transform:translateY(0) scaleY(.97)}100%{transform:none}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 5s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.ts{transform-box:fill-box;transform-origin:50% 0;animation:ts 3s ease-in-out infinite alternate}
@keyframes ts{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){#girl .fig,.eye,.ts{animation:none}}
#crowd{position:absolute;inset:0;pointer-events:none}
.pp{position:absolute;aspect-ratio:68/144}
.pp svg{display:block;width:100%;height:100%;overflow:visible}
.pp .bd{transform-box:fill-box;transform-origin:50% 100%;animation:hop 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes hop{0%,72%,100%{transform:translateY(0)}80%{transform:translateY(-7px)}88%{transform:translateY(0)}}
body.night .pp .bd{animation:dance .55s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes dance{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-5px) rotate(3deg)}}
.pt{display:none}
body.night .gr{display:none}
body.night .pt{display:block}
.arm{transform-box:fill-box;transform-origin:50% 8%}
.arm rect{fill:var(--g)}
body.night .arm rect{fill:var(--p)}
.al{animation:alu 4.2s ease-in-out infinite;animation-delay:var(--d)}
.ar{animation:aru 4.2s ease-in-out infinite;animation-delay:var(--d)}
@keyframes alu{0%,52%,100%{transform:rotate(6deg)}62%,84%{transform:rotate(155deg)}}
@keyframes aru{0%,52%,100%{transform:rotate(-6deg)}62%,84%{transform:rotate(-155deg)}}
body.night .al{animation:aln .55s ease-in-out infinite alternate;animation-delay:var(--d)}
body.night .ar{animation:arn .55s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes aln{from{transform:rotate(105deg)}to{transform:rotate(165deg)}}
@keyframes arn{from{transform:rotate(-165deg)}to{transform:rotate(-105deg)}}
body.night .pp svg{filter:drop-shadow(0 0 4px rgba(255,150,220,.5))}
#girl{z-index:120}
#garl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:visible}
.bu{display:none;animation:bt 1.4s ease-in-out infinite alternate}
@keyframes bt{from{opacity:.5}to{opacity:1}}
body.night .fl{display:none}
body.night .bu{display:block}
#beams{opacity:0;transition:opacity 1.6s;z-index:2;overflow:hidden;mix-blend-mode:screen}
body.night #beams{opacity:.55}
.beam{position:absolute;top:-8%;width:34vw;height:115vh;margin-left:-17vw;transform-origin:50% 0;background:linear-gradient(var(--c),transparent 78%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);animation:sweep var(--t) ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
#disco{position:absolute;z-index:2;left:9%;top:0;width:0;opacity:0;transition:opacity 1.6s;pointer-events:none}
body.night #disco{opacity:1}
#disco::before{content:'';position:absolute;left:0;top:0;width:2px;height:34px;background:#cfd3e0}
#disco i{position:absolute;left:-26px;top:32px;width:52px;height:52px;border-radius:50%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 9px),repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 9px),radial-gradient(circle at 35% 30%,#fff,#c7cde0 40%,#6b7390);box-shadow:0 0 24px 6px rgba(255,255,255,.45);animation:sb 3s linear infinite}
@keyframes sb{to{background-position:54px 0,0 0,0 0}}
@media (prefers-reduced-motion:reduce){.pp .bd,.arm,.bu,.beam,#disco i{animation:none}}
#btn{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);border:1px solid var(--gold);border-radius:999px;padding:10px 18px;font:600 15px 'Nunito',system-ui,sans-serif;white-space:nowrap;color:var(--navy);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);cursor:pointer;transition:background 1.6s,color 1.6s}
body.night #btn{background:rgba(20,38,79,.85);color:#ffe9a6}
#btn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
#hint{position:fixed;z-index:20;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.55);transition:opacity 1s;pointer-events:none}
@media (max-width:599px){#card{top:calc(env(safe-area-inset-top,0px) + 68px);padding:20px 16px 40px;width:94vw}.kicker{font-size:1.9rem}.name{font-size:2.7rem}.orn{margin:2px auto 8px}#msg{line-height:1.32}}
@media (max-height:520px) and (min-width:640px){#card{left:auto;right:3%;transform:none;width:min(58vw,560px)}#girl{left:22%}}
@media (max-height:520px){#card{top:calc(env(safe-area-inset-top,0px) + 56px);padding:14px 24px 26px}.kicker{font-size:1.7rem}.name{font-size:2.3rem}#msg{font-size:1rem;line-height:1.28}#btn{padding:7px 14px}}
@media (prefers-reduced-motion:reduce){.cloud,.fc,.bl,#stars i{animation:none}.rv{opacity:1;transform:none;filter:none;transition:none}}
</style>
</head>

<div id='disco'><i></i></div>
<canvas id="fx"></canvas>

<main id="card">
  <div class="kicker rv" style="--i:0">¡Felicidades!</div>
  <div class="name rv" style="--i:1"></div>
  <div class="orn rv" style="--i:2"></div>
  <div id="msg" aria-live="polite"></div>
  <svg class="seal" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="26" fill="#b3202f"/><circle cx="30" cy="30" r="21" fill="none" stroke="#e9606c" stroke-width="1.500" stroke-dasharray="2 3"/><path d="M30 14L34 25L46 26L37 33L40 45L30 38L20 45L23 33L14 26L26 25Z" fill="#ffd873"/></svg>
</main>

<button id="btn" type="button" aria-pressed="false"></button>
<div id="hint"></div>

<script>
const $=s=>document.querySelector(s), R=(a,b)=>a+Math.random()*(b-a);
const mk=(t,css,p,cls)=>{const e=document.createElement(t);e.style.cssText=css;if(cls)e.className=cls;p.appendChild(e);return e};
const NAME='Isabella', RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
$('.name').textContent=NAME;

/* estrellas y nubes */
for(let i=0;i<110;i++){const s=R(1.5,3.4);mk('i',`left:${R(0,100)}%;top:${R(0,65)}%;width:${s}px;height:${s}px;animation-delay:${-R(0,4)}s;animation-duration:${R(2,5)}s`,$('#stars'))}
[[8,'24vw',90,0],[22,'30vw',120,-40],[38,'20vw',100,-70],[14,'18vw',140,-100]].forEach(([t,w,d,dl])=>mk('div',`top:${t}%;--w:${w};--d:${d}s;--dl:${dl}s`,$('#clouds'),'cloud'));

/* birretes */
const CAP=c=>`<svg class="cap" viewBox="0 0 64 44"><path d="M16 22V33Q32 42 48 33V22L32 29Z" fill="${c}" opacity=".92"/><path d="M32 4L62 16L32 28L2 16Z" fill="${c}" stroke="#c9962b" stroke-width="1.600" stroke-linejoin="round"/><circle cx="32" cy="16" r="2.400" fill="#c9962b"/><path d="M32 16L56 19V33" stroke="#e8b43a" stroke-width="1.800" fill="none"/><rect x="53.500" y="32" width="5" height="9" rx="1.500" fill="#e8b43a"/></svg>`;
for(let i=0;i<9;i++)mk('div',`left:${R(2,92)}%;width:${R(30,52)}px;--d:${R(22,40)}s;--dl:-${R(0,30)}s;--x:${R(-80,80)}px;--r:${R(-200,200)}deg`,$('#caps'),'fc').innerHTML=CAP('#14264f');

/* globos */
const BC=['#14264f','#c9962b','#b3202f','#ffffff','#2d4a9a','#e8b43a'];
const BAL=c=>`<svg viewBox="0 0 40 120"><path d="M20 44Q14 70 22 90T20 118" stroke="#9a9a9a" stroke-width="1" fill="none"/><ellipse cx="20" cy="22" rx="16" ry="20" fill="${c}" stroke="rgba(0,0,0,.15)"/><ellipse cx="13" cy="14" rx="4" ry="7" fill="#fff" opacity=".4"/><path d="M20 42L16 48H24Z" fill="${c}"/></svg>`;
[3,6.5,10,13.5,17,81,84.5,88,91.5,95].forEach((l,i)=>mk('div',`left:${l}%;--b:${R(9,13).toFixed(1)}%;--dl:-${R(0,4).toFixed(1)}s`,$('#balloons'),'bl').innerHTML=BAL(BC[i%BC.length]));

/* confeti y fuegos artificiales */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H;
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
rs();addEventListener('resize',rs);
const PT=[],COL=['#f2b632','#b3202f','#14264f','#ffffff','#f7d774','#e8512f','#2d4a9a'],FW=['#ffd35a','#ff5a6e','#7fd1ff','#ffffff','#c58bff','#ff9d4a'];
const night=()=>document.body.classList.contains('night');
function confetti(x,y,n){for(let i=0;i<n;i++)PT.push({t:0,x,y,vx:R(-260,260),vy:R(-560,-120),g:520,dr:.985,l:R(2.4,4),a:R(0,6),va:R(-9,9),w:R(5,9),h:R(8,14),c:COL[i%COL.length]})}
function spark(x,y){const c=FW[Math.floor(R(0,FW.length))],c2=FW[Math.floor(R(0,FW.length))];for(let i=0;i<80;i++){const a=R(0,6.283),s=R(40,250);PT.push({t:1,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:110,dr:.975,l:R(1,1.9),m:1.9,c:i%3?c:c2})}}
function rocket(x,ty){PT.push({t:2,x,y:H,vx:0,vy:-R(520,700),g:0,dr:1,l:5,ty,c:'#ffe9a6'})}
let lt=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-lt)/1000);lt=now;
  cx.clearRect(0,0,W,H);
  {if(Math.random()<dt*(night()?2.5:5))PT.push({t:3,x:R(0,W),y:-12,vx:R(-15,15),vy:R(50,100),g:0,dr:1,l:14,a:R(0,6),va:R(-4,4),w:R(5,8),h:R(8,12),c:COL[Math.floor(R(0,COL.length))],ph:R(0,6)})}
  if(night()&&Math.random()<dt*.9)rocket(R(.15,.85)*W,R(.12,.42)*H);
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i];p.l-=dt;
    if(p.t==3){p.ph+=dt*2;p.x+=(p.vx+Math.sin(p.ph)*30)*dt;p.y+=p.vy*dt;p.a+=p.va*dt}
    else{const k=Math.pow(p.dr,dt*60);p.vx*=k;p.vy=p.vy*k+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a=(p.a||0)+(p.va||0)*dt}
    if(p.t==2&&p.y<=p.ty){spark(p.x,p.y);p.l=0}
    if(p.l<=0||p.y>H+30){PT.splice(i,1);continue}
    if(p.t==1){cx.globalAlpha=Math.max(0,p.l/p.m);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2,0,6.283);cx.fill();cx.globalAlpha=1}
    else if(p.t==2){cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.500,0,6.283);cx.fill()}
    else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.a*1.3)+.2));cx.restore()}
  }
  requestAnimationFrame(tick);
}
if(!RM)requestAnimationFrame(tick);

/* lanzar birretes (día) o fuegos (noche) al tocar */
function throwCaps(x,y){
  ['#14264f','#b3202f','#2d4a9a','#14264f'].forEach((c,i)=>{
    const d=mk('div',`left:${x-24}px;top:${y-16}px;width:${R(40,56)}px`,document.body,'tc');d.innerHTML=CAP(c);
    const dx=R(-150,150),up=R(170,300),fall=R(40,150),rot=R(-540,540);
    d.animate([{transform:'translate(0,0) rotate(0deg)',offset:0,easing:'cubic-bezier(.2,.7,.4,1)'},{transform:`translate(${dx*.55}px,${-up}px) rotate(${rot*.55}deg)`,offset:.45,easing:'cubic-bezier(.5,0,1,1)'},{transform:`translate(${dx}px,${fall}px) rotate(${rot}deg)`,offset:1}],{duration:R(1900,2600),delay:i*70,fill:'both'}).onfinish=()=>d.remove();
  });
  confetti(x,y,50);
}
addEventListener('pointerdown',e=>{
  if(e.target.closest('#btn'))return;
  if(night())spark(e.clientX,e.clientY);else throwCaps(e.clientX,e.clientY);
  $('#hint').style.opacity=0;const gg=$('#girl');gg.classList.remove('ch');void gg.offsetWidth;gg.classList.add('ch');
});

/* ajustar el tamaño de la chica al espacio libre bajo el diploma */
function fitGirl(){
  const g=$('#girl'),m=$('#msg'),c=$('#card'),H=innerHeight;
  const land=matchMedia('(max-height:520px) and (min-width:640px)').matches;
  m.style.fontSize='';
  if(land){g.style.display='block';g.style.height=Math.min(270,H*.66)+'px';return}
  const want=Math.min(230,H*.3);
  let fs=parseFloat(getComputedStyle(m).fontSize);
  for(let i=0;i<8;i++){
    const r=c.getBoundingClientRect();
    if(H-(r.bottom+30)-6>=want||fs<=16)break;
    fs-=1;m.style.fontSize=fs+'px';
  }
  const r=c.getBoundingClientRect(),sp=H-(r.bottom+30)-6,gh=Math.min(270,H*.34,sp);
  g.style.display=gh<80?'none':'block';g.style.height=Math.max(gh,0)+'px';
}
function fitGirlOld(){
  const g=$('#girl'),c=$('#card').getBoundingClientRect();
  const sp=innerHeight-(c.bottom+36)-6, gh=Math.min(270,innerHeight*.34,sp);
  g.style.display=gh<95?'none':'block';g.style.height=Math.max(gh,0)+'px';
}
addEventListener('resize',()=>setTimeout(fitGirl,120));
if(document.fonts)document.fonts.ready.then(()=>fitGirl());

/* gente: graduados de día, fiesta de noche */
const SK=['#f6cfb0','#e8b48e','#d19a72','#b07650','#8a5a3a','#6b4429'],HC=['#1d110c','#3a2418','#5a3a2a','#8a5a2a','#c9a05a','#2a2a2a','#7a2a1a'],GOWN=['#14264f','#14264f','#1d1d2b','#8f1624','#2d4a9a','#0f3d2e'],STOLE=['#e8b43a','#b3202f','#ffffff','#e8b43a'],PARTY=['#e8512f','#f2b632','#2fb6a6','#8e5be8','#ff5a8a','#3a8bf0','#ffffff','#ff9d4a'],PANT=['#2a3350','#1d1d2b','#3b3b55','#3a2a24'];
const PPL=[],pick=a=>a[Math.floor(R(0,a.length))];
function person(o){
  const {sk,hc,g,st,p1,p2,hs,dress,dip,hat,pc}=o;
  const hb=hs==1?`<path d='M18 22Q16 4 30 4Q44 4 42 22L44 52Q42 58 36 56L24 56Q18 58 16 52Z' fill='${hc}'/>`:hs==3?`<circle cx='30' cy='17' r='16' fill='${hc}'/>`:'';
  const ht=hs==5?`<path d='M19 19Q19 9 30 9Q41 9 41 19Q36 15 30 15Q24 15 19 19Z' fill='${hc}'/>`:`<path d='M18 21Q17 6 30 6Q43 6 42 21Q38 12 30 13Q22 12 18 21Z' fill='${hc}'/>`;
  const ex=hs==2?`<circle cx='30' cy='4' r='5' fill='${hc}'/>`:hs==4?`<path d='M41 14Q54 16 50 40Q48 46 44 42Q47 30 41 24Z' fill='${hc}'/>`:'';
  return `<svg viewBox='-4 -14 68 144'><ellipse cx='30' cy='121' rx='20' ry='4' fill='#000' opacity='.22'/><g class='bd'>`
   +`<rect x='22' y='96' width='6' height='24' fill='${sk}'/><rect x='32' y='96' width='6' height='24' fill='${sk}'/><ellipse cx='25' cy='120' rx='6' ry='3' fill='#241a1a'/><ellipse cx='35' cy='120' rx='6' ry='3' fill='#241a1a'/>`
   +`<g class='gr'><path d='M16 40Q30 34 44 40L51 114Q30 120 9 114Z' fill='${g}'/><path d='M21 39L28 40L27 82L22 80ZM39 39L32 40L33 82L38 80Z' fill='${st}'/><path d='M24 60L18 112M36 60L42 112' stroke='#000' stroke-opacity='.2' stroke-width='2' fill='none'/></g>`
   +`<g class='pt'>`+(dress?`<path d='M19 40Q30 35 41 40L47 98H13Z' fill='${p1}'/>`:`<path d='M19 40Q30 35 41 40L40 80L20 80Z' fill='${p1}'/><path d='M20 78H40L39 116H31L30 92L29 116H21Z' fill='${p2}'/>`)+`</g>`
   +hb+`<rect x='27' y='31' width='6' height='9' fill='${sk}'/><circle cx='30' cy='23' r='11' fill='${sk}'/>`+ht+ex
   +`<circle cx='26' cy='24' r='1.300' fill='#2a1a14'/><circle cx='34' cy='24' r='1.300' fill='#2a1a14'/><ellipse cx='23.500' cy='28' rx='2.500' ry='1.500' fill='#e98b8b' opacity='.3'/><ellipse cx='36.500' cy='28' rx='2.500' ry='1.500' fill='#e98b8b' opacity='.3'/><path d='M26 29Q30 33 34 29' stroke='#a8454f' stroke-width='1.200' fill='none' stroke-linecap='round'/>`
   +`<g class='gr'><path d='M17 11L30 5L43 11L30 17Z' fill='${g}' stroke='#c9962b' stroke-width='1'/><path d='M22 13Q30 18 38 13V18Q30 22 22 18Z' fill='${g}'/><path d='M30 11Q40 12 43 11V22' stroke='#e8b43a' stroke-width='1' fill='none'/><circle cx='43' cy='23.500' r='1.600' fill='#e8b43a'/></g>`
   +(hat?`<g class='pt'><path d='M22 10L30 -10L38 10Z' fill='${pc}'/><circle cx='30' cy='-10' r='2.500' fill='#fff'/></g>`:'')
   +`<g class='arm al'><rect x='15' y='40' width='8' height='30' rx='4'/><circle cx='19' cy='71' r='4' fill='${sk}'/></g>`
   +`<g class='arm ar'><rect x='37' y='40' width='8' height='30' rx='4'/><circle cx='41' cy='71' r='4' fill='${sk}'/>`+(dip?`<g class='gr'><path d='M37 67L53 62' stroke='#fffaf0' stroke-width='5' stroke-linecap='round'/><path d='M44 65L46 64.200' stroke='#b3202f' stroke-width='5'/></g>`:'')+`</g></g></svg>`;
}
function crowd(){
  const box=$('#crowd'),n=innerWidth<600?14:Math.min(32,Math.round(innerWidth/46)),base=Math.max(70,Math.min(165,innerHeight*.19));
  for(let i=0;i<n;i++){
    const r=Math.random(),g=pick(GOWN),p1=pick(PARTY);
    let x=((i+R(.15,.85))/n)*100;
    if(r<.6&&Math.abs(x-50)<8)x+=x<50?-9:9;
    const h=base*(1-.38*r),b=1+r*10.5;
    const e=mk('div',`left:${x.toFixed(1)}%;bottom:${b.toFixed(1)}%;height:${h.toFixed(0)}px;z-index:${Math.round(100-r*100)};transform:translateX(-50%);--d:-${R(0,4).toFixed(1)}s;--g:${g};--p:${p1}`,box,'pp');
    e.dataset.g=g;
    e.innerHTML=person({sk:pick(SK),hc:pick(HC),g,st:pick(STOLE),p1,p2:pick(PANT),hs:Math.floor(R(0,6)),dress:Math.random()<.45,dip:Math.random()<.5,hat:Math.random()<.4,pc:pick(PARTY)});
    PPL.push(e);
  }
}
function garland(){
  const W=innerWidth,H=innerHeight,y0=H*.66,sag=H*.035,x0=W*.04,x1=W*.96,s=$('#garl');
  s.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let h=`<line x1='${x0}' y1='${H*.86}' x2='${x0}' y2='${y0}' stroke='#6b5a3a' stroke-width='4'/><line x1='${x1}' y1='${H*.86}' x2='${x1}' y2='${y0}' stroke='#6b5a3a' stroke-width='4'/><path d='M${x0} ${y0}Q${W/2} ${y0+2*sag} ${x1} ${y0}' stroke='#7a6a45' stroke-width='1.500' fill='none'/>`;
  const n=Math.round(W/38),FC=['#b3202f','#14264f','#e8b43a','#ffffff','#2d4a9a'];
  for(let i=1;i<n;i++){const t=i/n,px=(1-t)*(1-t)*x0+2*(1-t)*t*(W/2)+t*t*x1,py=(1-t)*(1-t)*y0+2*(1-t)*t*(y0+2*sag)+t*t*y0;
    h+=`<path class='fl' d='M${px-9} ${py}L${px+9} ${py}L${px} ${py+22}Z' fill='${FC[i%5]}'/><circle class='bu' cx='${px}' cy='${py+5}' r='4.500' fill='#ffe9a6' style='animation-delay:-${(i%7)*.2}s;filter:drop-shadow(0 0 5px #ffd873)'/>`}
  s.innerHTML=h;
}
[[15,'rgba(255,80,170,.75)',5,0],[38,'rgba(80,220,255,.7)',6.5,-2],[62,'rgba(255,220,90,.65)',5.5,-4],[85,'rgba(170,110,255,.7)',7,-1]].forEach(([l,c,t,dl])=>mk('div',`left:${l}%;--c:${c};--t:${t}s;animation-delay:${dl}s`,$('#beams'),'beam'));
setInterval(()=>{
  if(night()||RM||document.hidden||!PPL.length)return;
  const f=PPL[Math.floor(R(0,PPL.length))],r=f.getBoundingClientRect(),w=Math.max(22,r.height*.3);
  const d=mk('div',`left:${r.left+r.width/2-w/2}px;top:${r.top+r.height*.05}px;width:${w}px`,document.body,'tc');d.innerHTML=CAP(f.dataset.g);
  const dx=R(-40,40),up=R(70,140);
  d.animate([{transform:'translate(0,0) rotate(0deg)',offset:0,easing:'cubic-bezier(.2,.7,.4,1)'},{transform:`translate(${dx*.5}px,${-up}px) rotate(${R(-300,300)}deg)`,offset:.5,easing:'cubic-bezier(.5,0,1,1)'},{transform:`translate(${dx}px,${r.height*.2}px) rotate(${R(-500,500)}deg)`,offset:1}],{duration:R(1500,2100)}).onfinish=()=>d.remove();
},1300);

/* mensajes */
const TXT={
  day:['¡Hoy es un día para sentirte muy orgullosa de ti!','Espero que disfrutes cada momento de esta nueva etapa y recuerdes todo lo que tuviste que superar para llegar hasta aquí.','Que nunca te falten motivos para seguir creciendo, aprendiendo y persiguiendo tus sueños.','Te deseo un día precioso, lleno de felicidad no siempre se vive un momento así.','¡Muchas felicidades por tu graduación!'],
  night:['Espero que esta noche te vayas a descansar con el corazón lleno de orgullo por todo lo que has conseguido.','Hoy termina una etapa, pero comienza un camino lleno de nuevas oportunidades.','No tengas miedo de soñar en grande ni de perseguir aquello que tanto deseas.','Ojalá la vida te permita alcanzar cada una de tus metas y te regale muchas razones para sentirte orgullosa de ti misma.','Nunca olvides lo lejos que has llegado.']
};
const TXT_OLD={
  day:['Hoy cierras una etapa llena de esfuerzo, desvelos y mucha constancia.','Todo ese camino te trajo hasta aquí,','y llegaste con la frente en alto.','Qué orgullo verte lograrlo.','Que este sea solo el comienzo de todo lo que viene.'],
  night:['Esta noche brillas más que cualquier fuego artificial.','Te lo ganaste a pulso: cada examen, cada duda y cada desvelo.','Disfruta, celebra y cuéntale al mundo lo que lograste.','Mañana vendrán nuevos sueños, pero hoy toca festejar.','¡Felicidades, graduada!']
};
const card=$('#card'),btn=$('#btn');
function fill(n){const a=TXT[n?'night':'day'];$('#msg').innerHTML=a.map((t,i)=>`<p class="rv${i==a.length-1?' f':''}" style="--i:${i+3}">${t}</p>`).join('')}
function reveal(){card.classList.add('reset');card.classList.remove('show');void card.offsetWidth;card.classList.remove('reset');requestAnimationFrame(()=>card.classList.add('show'))}
function setMode(n){
  document.body.classList.toggle('night',n);
  btn.setAttribute('aria-pressed',n);
  btn.textContent=n?'☀️ Volver a la ceremonia':'🌙 Pasar a la fiesta';
  $('#hint').textContent=n?'Toca la pantalla: ¡fuegos artificiales!':'Toca la pantalla: ¡lanza los birretes!';
  fill(n);reveal();fitGirl();
  try{sessionStorage.setItem('mode',n?'1':'0')}catch(e){}
}
btn.addEventListener('click',()=>setMode(!night()));
let m0=null;try{if(sessionStorage.getItem('rl')){m0=sessionStorage.getItem('mode');sessionStorage.removeItem('rl')}}catch(e){}
const h=new Date().getHours();
setMode(m0=='1');
crowd();garland();
let rT,W0=innerWidth;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(Math.abs(innerWidth-W0)/W0>.2){try{sessionStorage.setItem('rl','1')}catch(e){}location.reload()}},500)});
</script>
</body>
</html>
